<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Once Metros</title>
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00c853">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <a class="logo" href="/"><span class="logo-pulse"></span>Once Metros</a>
      <div class="nav-links">
        <a href="/" class="active" data-i18n="nav.competitions">Competencias</a>
        <a href="pages/torneos" data-i18n="nav.friendTournaments">Torneos de amigos</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="section home-shell">
      <div id="home-error" class="auth-error hidden"></div>

      <section id="competition-picker" class="workspace-pane">
        <div class="section-header">
          <div>
            <span class="section-label"><span class="dot"></span><span data-i18n="section.available">Disponibles</span></span>
            <h1 class="page-title" data-i18n="page.competitions">Competencias</h1>
          </div>
        </div>
        <div id="competencias-list" class="competition-list"></div>
      </section>

      <section id="competencia-workspace" class="hidden">
        <div class="screen-top">
          <button class="icon-btn" data-back-to-competencias aria-label="Volver a competencias">‹</button>
          <div class="screen-title">
            <span class="section-label"><span class="dot"></span>Competencia</span>
            <h1 id="competencia-title" class="page-title">Competencia</h1>
          </div>
        </div>

        <div class="tabs workspace-tabs">
          <button class="tab-btn active" data-home-tab="predicciones" data-i18n="tab.predictions">Predicciones</button>
          <button class="tab-btn" data-home-tab="torneos" data-i18n="tab.friendTournaments">Torneos de Amigos</button>
        </div>

        <div id="home-tab-predicciones" class="tab-content">
          <div class="view-tabs" id="partidos-view-tabs">
            <button class="view-tab active" type="button" data-view="matches" data-i18n="tab.matches">Partidos</button>
            <button class="view-tab" type="button" data-view="predictions" data-i18n="tab.predictions">Predicciones</button>
          </div>

          <div id="view-matches" class="view-pane">
            <div class="filters-bar">
              <button class="filter-chip active" data-group="estado" data-value="" data-i18n="filter.all">Todos</button>
              <button class="filter-chip" data-group="estado" data-value="proximo" data-i18n="filter.upcoming">Próximos</button>
              <button class="filter-chip" data-group="estado" data-value="en-vivo" data-i18n="filter.live">En vivo</button>
              <button class="filter-chip" data-group="estado" data-value="finalizado" data-i18n="filter.finished">Finalizados</button>
            </div>
            <div id="matches-list" class="matches-grid"></div>
          </div>

          <div id="view-predictions" class="view-pane hidden">
            <div class="group-carousel">
              <button class="group-carousel__nav group-carousel__prev" type="button" data-i18n-aria="groups.prevGroup" aria-label="Grupo anterior">‹</button>
              <div class="group-carousel__label" id="group-carousel-label"></div>
              <button class="group-carousel__nav group-carousel__next" type="button" data-i18n-aria="groups.nextGroup" aria-label="Grupo siguiente">›</button>
            </div>
            <div class="predictions-split">
              <div class="predictions-split__pane predictions-split__standings" id="group-standings"></div>
              <div class="predictions-split__pane predictions-split__matches" id="group-matches"></div>
            </div>
          </div>
        </div>

        <div id="home-tab-torneos" class="tab-content hidden">
          <a id="create-torneo-btn" href="pages/torneo-edit" class="btn btn-primary hidden" style="display:none;margin-bottom:.75rem" data-i18n="action.createTournament">+ Crear torneo</a>
          <div id="torneos-list" class="tournament-list"></div>
        </div>
      </section>
    </section>
  </main>

  <nav class="bottom-nav">
    <div class="bottom-nav__inner">
      <a class="bottom-nav__item active" href="/" data-i18n="nav.competitions">Competencias</a>
      <a class="bottom-nav__item" href="pages/torneos" data-i18n="nav.friendTournaments">Torneos de amigos</a>
    </div>
  </nav>

  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/predictions.js"></script>
  <script src="js/world-cup-2026.js"></script>
  <script src="js/groups.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
