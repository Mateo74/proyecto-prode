<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resetear Contraseña | Once Metros</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .password-reset-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 400px;
      width: 100%;
      padding: 40px;
      margin: 20px;
    }
    .password-reset-container h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #333;
    }
    .password-reset-container p {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .password-requirements {
      background: #f9f9f9;
      border: 1px solid #eee;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #666;
    }
    .password-requirements li {
      margin-bottom: 6px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error-message, .success-message {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 13px;
      display: none;
    }
    .error-message {
      background: #fee;
      border: 1px solid #fcc;
      color: #c00;
    }
    .error-message.show, .success-message.show {
      display: block;
    }
    .success-message {
      background: #efe;
      border: 1px solid #cfc;
      color: #060;
    }
    .links {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }
    .links a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
    }
    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="password-reset-container">
    <h1>Establecer Nueva Contraseña</h1>
    <p>Ingresa tu nueva contraseña para recuperar acceso a tu cuenta.</p>
    
    <div id="error-message" class="error-message"></div>
    <div id="success-message" class="success-message"></div>

    <form id="reset-password-form">
      <div class="form-group">
        <label for="password">Nueva Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="Mínimo 8 caracteres">
      </div>
      <div class="form-group">
        <label for="password-confirm">Confirmar Contraseña</label>
        <input type="password" id="password-confirm" name="password-confirm" required placeholder="Repite tu contraseña">
      </div>
      <ul class="password-requirements">
        <li>✓ Mínimo 8 caracteres</li>
        <li>✓ Máximo 128 caracteres</li>
      </ul>
      <button type="submit" class="btn btn-primary" id="submit-btn">Actualizar Contraseña</button>
    </form>

    <div class="links">
      <p><a href="auth.html">Volver a Iniciar Sesión</a></p>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    // Extract token from URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      const errorEl = document.getElementById('error-message');
      errorEl.textContent = 'Token inválido. Por favor solicita uno nuevo.';
      errorEl.classList.add('show');
      document.getElementById('reset-password-form').style.display = 'none';
    }

    document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('password-confirm').value;
      const errorEl = document.getElementById('error-message');
      const successEl = document.getElementById('success-message');
      const submitBtn = document.getElementById('submit-btn');

      // Clear messages
      errorEl.classList.remove('show');
      successEl.classList.remove('show');

      // Validation
      if (!password) {
        errorEl.textContent = 'Por favor ingresa una contraseña';
        errorEl.classList.add('show');
        return;
      }

      if (password.length < 8) {
        errorEl.textContent = 'La contraseña debe tener mínimo 8 caracteres';
        errorEl.classList.add('show');
        return;
      }

      if (password.length > 128) {
        errorEl.textContent = 'La contraseña no puede exceder 128 caracteres';
        errorEl.classList.add('show');
        return;
      }

      if (password !== passwordConfirm) {
        errorEl.textContent = 'Las contraseñas no coinciden';
        errorEl.classList.add('show');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Actualizando...';

      try {
        const result = await API.resetPassword({ token, password });
        successEl.textContent = '¡Contraseña actualizada exitosamente!';
        successEl.classList.add('show');
        document.getElementById('reset-password-form').style.display = 'none';
        
        // Store session
        if (result.token && result.usuario) {
          API.setSession({ token: result.token, usuario: result.usuario });
        }
        
        // Redirect after 2 seconds
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);
      } catch (error) {
        errorEl.textContent = error.message || 'Error al actualizar contraseña';
        errorEl.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Actualizar Contraseña';
      }
    });
  </script>
</body>
</html>
