<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torneo | Once Metros</title>
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00c853">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <a class="logo" href="../index.html"><span class="logo-pulse"></span>Once Metros</a>
      <div class="nav-links">
        <a href="../index.html">Competencias</a>
        <a href="torneos.html" class="active">Torneos de amigos</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-header page-header--compact">
      <div class="page-header-inner">
        <a id="torneo-edit-back" class="icon-btn" href="../index.html#torneos" aria-label="Volver">‹</a>
        <div>
          <span id="torneo-edit-subtitle" class="section-label"><span class="dot"></span>Torneo de Amigos</span>
          <h1 id="torneo-edit-title" class="page-title">Nuevo torneo</h1>
        </div>
      </div>
    </section>

    <section class="section">
      <div id="torneo-edit-feedback" class="invite-feedback hidden"></div>
      <form id="torneo-edit-form" class="form-card" style="display:flex;flex-direction:column;gap:1rem;">
        <div class="form-group">
          <label class="form-label" for="torneo-nombre">Nombre del torneo</label>
          <input id="torneo-nombre" class="form-input" type="text" name="nombre"
            placeholder="Ej: Los del trabajo" required maxlength="80" autocomplete="off">
        </div>
        <button id="torneo-edit-save" class="btn btn-primary" type="submit">Crear torneo</button>
      </form>

      <button id="torneo-edit-delete" class="btn btn-danger hidden" type="button"
        style="margin-top:1.5rem;width:100%;">Eliminar torneo</button>
    </section>
  </main>

  <nav class="bottom-nav">
    <div class="bottom-nav__inner">
      <a class="bottom-nav__item" href="../index.html">Competencias</a>
      <a class="bottom-nav__item active" href="torneos.html">Torneos de amigos</a>
    </div>
  </nav>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/predictions.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
