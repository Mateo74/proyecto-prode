<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar | Once Metros</title>
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00c853">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <a class="logo" href="../index.html"><span class="logo-pulse"></span>Once Metros</a>
      <div class="nav-links">
        <a href="../index.html" data-i18n="nav.competitions">Competencias</a>
        <a href="../index.html#torneos" data-i18n="nav.friendTournaments">Torneos</a>
        <a href="auth.html" class="active" data-auth-link data-auth-href="auth.html">Ingresar</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-header">
      <div class="page-header-inner">
        <div>
          <span class="section-label"><span class="dot"></span><span data-i18n="section.account">Cuenta</span></span>
          <h1 class="page-title" data-i18n="page.signIn">Ingresar</h1>
        </div>
      </div>
    </section>

    <section class="section auth-section">
      <div class="tabs">
        <button class="tab-btn active" data-tab="login" data-i18n="tab.signIn">Ingresar</button>
        <button class="tab-btn" data-tab="register" data-i18n="tab.register">Crear cuenta</button>
      </div>

      <div id="auth-error" class="auth-error hidden"></div>

      <div id="google-auth" class="google-auth hidden">
        <div id="google-signin"></div>
        <div class="auth-divider"><span>o</span></div>
      </div>

      <div id="tab-login" class="tab-content">
        <form id="login-form" class="auth-form">
          <label>
            <span data-i18n="auth.userOrEmail">Usuario o email</span>
            <input name="identificador" autocomplete="username" required>
          </label>
          <label>
            <span data-i18n="auth.password">Clave</span>
            <input name="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="btn btn-primary btn-lg" type="submit" data-i18n="tab.signIn">Ingresar</button>
        </form>
      </div>

      <div id="tab-register" class="tab-content hidden">
        <form id="register-form" class="auth-form">
          <label>
            <span data-i18n="auth.username">Usuario</span>
            <input name="username" autocomplete="username" minlength="3" maxlength="24" required>
          </label>
          <label>
            <span data-i18n="auth.name">Nombre</span>
            <input name="nombre" autocomplete="given-name">
          </label>
          <label>
            <span data-i18n="auth.lastName">Apellido</span>
            <input name="apellido" autocomplete="family-name">
          </label>
          <label>
            <span data-i18n="auth.email">Email</span>
            <input name="email" type="email" autocomplete="email">
          </label>
          <label>
            <span data-i18n="auth.password">Clave</span>
            <input name="password" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <button class="btn btn-primary btn-lg" type="submit" data-i18n="tab.register">Crear cuenta</button>
        </form>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <div class="bottom-nav__inner">
      <a class="bottom-nav__item" href="../index.html" data-i18n="nav.competitions">Competencias</a>
      <a class="bottom-nav__item" href="../index.html#torneos" data-i18n="nav.friendTournaments">Torneos</a>
    </div>
  </nav>

  <script src="../js/i18n.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/predictions.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
