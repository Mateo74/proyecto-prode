<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking | Once Metros</title>
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00c853">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <a class="logo" href="../index.html"><span class="logo-pulse"></span>Once Metros</a>
      <div class="nav-links">
        <a href="../index.html" data-i18n="nav.competitions">Competencias</a>
        <a href="torneos.html" class="active" data-i18n="nav.friendTournaments">Torneos de amigos</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-header page-header--compact">
      <div class="page-header-inner">
        <a class="icon-btn" href="torneos.html" aria-label="Volver">‹</a>
        <div>
          <span id="torneo-subtitle" class="section-label"><span class="dot"></span>Torneo de Amigos</span>
          <h1 id="torneo-title" class="page-title">Ranking</h1>
        </div>
        <div class="page-header-actions">
          <button id="invite-btn" class="btn btn-primary btn-sm hidden" type="button" data-i18n="action.invite">Invitar</button>
          <a class="icon-btn" href="puntos.html" data-i18n-aria="nav.howPoints" data-i18n-title="nav.howPoints" aria-label="Cómo se calculan los puntos" title="Cómo se calculan los puntos">ⓘ</a>
          <div class="torneo-action-menu" id="torneo-action-menu">
            <button class="icon-btn" id="torneo-action-toggle" aria-label="Más opciones" title="Más opciones">⋮</button>
            <div class="torneo-action-dropdown" id="torneo-action-dropdown">
              <button data-torneo-action="edit"   class="hidden" data-i18n="action.rename">Cambiar nombre</button>
              <button data-torneo-action="leave"  class="hidden" data-i18n="action.leaveMenu">Salir del torneo</button>
              <button data-torneo-action="delete" class="hidden danger" data-i18n="action.deleteMenu">Eliminar torneo</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="tabs workspace-tabs">
      <button class="tab-btn active" data-clasif-tab="posiciones" data-i18n="tab.standings">Posiciones</button>
      <button class="tab-btn" data-clasif-tab="predicciones" data-i18n="tab.myPredictions">Mis predicciones</button>
    </div>

    <div id="clasif-tab-posiciones" class="tab-content">
      <section class="section">
        <div id="podium" class="podium"></div>
        <div id="ranking-list" class="ranking-list"></div>
      </section>

    </div>

    <div id="clasif-tab-predicciones" class="tab-content hidden">
      <section class="section">
        <div id="mis-predicciones-list" class="pred-list"></div>
      </section>
    </div>
  </main>

  <!-- Drawer: predicciones de otro usuario -->
  <div id="user-preds-overlay" class="user-preds-overlay hidden" aria-hidden="true"></div>
  <div id="user-preds-drawer" class="user-preds-drawer hidden" role="dialog" aria-modal="true">
    <div class="user-preds-drawer__handle"></div>
    <div class="user-preds-drawer__head">
      <div>
        <span id="user-preds-name" class="user-preds-drawer__title">Usuario</span>
        <span id="user-preds-meta" class="user-preds-drawer__meta"></span>
      </div>
      <button id="user-preds-close" class="icon-btn" type="button" aria-label="Cerrar">×</button>
    </div>
    <div id="user-preds-list" class="user-preds-list"></div>
  </div>

  <nav class="bottom-nav">
    <div class="bottom-nav__inner">
      <a class="bottom-nav__item" href="../index.html" data-i18n="nav.competitions">Competencias</a>
      <a class="bottom-nav__item active" href="torneos.html" data-i18n="nav.friendTournaments">Torneos de amigos</a>
    </div>
  </nav>

  <script src="../js/i18n.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/predictions.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
