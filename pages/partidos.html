<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partidos | Once Metros</title>
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00c853">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <a class="logo" href="/"><span class="logo-pulse"></span>Once Metros</a>
      <div class="nav-links">
        <a href="/" data-i18n="nav.competitions">Competencias</a>
        <a href="torneos" data-i18n="nav.friendTournaments">Torneos de amigos</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-header page-header--compact">
      <div class="page-header-inner">
        <a class="icon-btn" href="/#predicciones" aria-label="Volver">‹</a>
        <div>
          <span class="section-label"><span class="dot"></span><span data-i18n="section.competition">Competencia</span></span>
          <h1 class="page-title" data-i18n="page.matches">Partidos</h1>
        </div>
        <div id="selected-context" class="selected-context"></div>
      </div>
    </section>

    <section class="section">
      <div class="filters-bar">
        <button class="filter-chip" data-group="estado" data-value="" data-i18n="filter.all">Todos</button>
        <button class="filter-chip active" data-group="estado" data-value="proximo" data-i18n="filter.upcoming">Próximos</button>
        <button class="filter-chip" data-group="estado" data-value="en-vivo" data-i18n="filter.live">En vivo</button>
        <button class="filter-chip" data-group="estado" data-value="finalizado" data-i18n="filter.finished">Finalizados</button>
        <a class="icon-btn filters-bar__info" href="puntos" data-i18n-aria="nav.howPoints" data-i18n-title="nav.howPoints" aria-label="Cómo se calculan los puntos" title="Cómo se calculan los puntos">ⓘ</a>
      </div>
      <div id="standings-toggle" class="view-toggle hidden">
        <button class="view-toggle__btn active" type="button" data-results-view="matches" data-i18n="view.matches">Partidos</button>
        <button class="view-toggle__btn" type="button" data-results-view="standings" data-i18n="view.standings">Posiciones</button>
      </div>
      <div id="matches-list" class="matches-grid"></div>
      <div id="standings-view" class="hidden"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <div class="bottom-nav__inner">
      <a class="bottom-nav__item" href="/" data-i18n="nav.competitions">Competencias</a>
      <a class="bottom-nav__item" href="torneos" data-i18n="nav.friendTournaments">Torneos de amigos</a>
    </div>
  </nav>

  <script src="../js/i18n.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/predictions.js"></script>
  <script src="../js/world-cup-2026.js"></script>
  <script src="../js/groups.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
