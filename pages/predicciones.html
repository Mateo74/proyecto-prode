<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predicciones | Once Metros</title>
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00c853">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <a class="logo" href="../index.html"><span class="logo-pulse"></span>Once Metros</a>
      <div class="nav-links">
        <a href="../index.html" data-i18n="nav.competitions">Competencias</a>
        <a href="predicciones.html" class="active" data-i18n="nav.predictions">Predicciones</a>
        <a href="torneos.html" data-i18n="nav.friendTournaments">Torneos de amigos</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-header">
      <div class="page-header-inner">
        <div>
          <span class="section-label"><span class="dot"></span><span data-i18n="section.myPlays">Mis jugadas</span></span>
          <h1 class="page-title" data-i18n="page.predictions">Predicciones</h1>
        </div>
        <div id="selected-context" class="selected-context"></div>
      </div>
    </section>

    <section class="section">
      <div class="stats-bar">
        <div class="stat-item"><strong class="stat-val" id="stat-puntos">0</strong><span class="stat-label" data-i18n="stat.points">Puntos</span></div>
        <div class="stat-item"><strong class="stat-val" id="stat-aciertos">0</strong><span class="stat-label" data-i18n="stat.hits">Aciertos</span></div>
        <div class="stat-item"><strong class="stat-val" id="stat-pct">0%</strong><span class="stat-label" data-i18n="stat.accuracy">Efectividad</span></div>
        <div class="stat-item"><strong class="stat-val" id="stat-racha">0</strong><span class="stat-label" data-i18n="stat.streak">Racha</span></div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="pendientes" data-i18n="tab.pending">Pendientes</button>
        <button class="tab-btn" data-tab="historial" data-i18n="tab.history">Historial</button>
      </div>

      <div id="tab-pendientes" class="tab-content">
        <div id="predictions-pending"></div>
      </div>
      <div id="tab-historial" class="tab-content hidden">
        <div id="predictions-history"></div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <div class="bottom-nav__inner">
      <a class="bottom-nav__item" href="../index.html" data-i18n="nav.competitions">Competencias</a>
      <a class="bottom-nav__item" href="torneos.html" data-i18n="nav.friendTournaments">Torneos de amigos</a>
    </div>
  </nav>

  <script src="../js/i18n.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/predictions.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
