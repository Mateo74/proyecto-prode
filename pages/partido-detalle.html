<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partido | Once Metros</title>
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00c853">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <a class="logo" href="/"><span class="logo-pulse"></span>Once Metros</a>
      <div class="nav-links">
        <a href="/" data-i18n="nav.competitions">Competencias</a>
        <a href="torneos" class="active" data-i18n="nav.friendTournaments">Torneos de amigos</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-header page-header--compact">
      <div class="page-header-inner">
        <button class="icon-btn" id="back-btn" aria-label="Volver">‹</button>
      </div>
    </section>

    <section class="section">
      <div id="match-card-container"></div>
    </section>

    <section class="section" style="padding-top:0">
      <p id="match-ranking-notice" class="section-notice hidden" data-i18n="match.predsHidden"></p>
      <div id="match-podium" class="podium"></div>
      <div id="match-ranking-list" class="ranking-list"></div>
    </section>
  </main>

  <script src="../js/i18n.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/predictions.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
