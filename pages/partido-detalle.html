<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partido | Once Metros</title>
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00c853">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <a class="logo" href="/"><span class="logo-pulse"></span>Once Metros</a>
      <div class="nav-links">
        <a href="/" data-i18n="nav.competitions">Competencias</a>
        <a href="torneos" class="active" data-i18n="nav.friendTournaments">Torneos de amigos</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-header page-header--compact">
      <div class="page-header-inner">
        <button class="icon-btn" id="back-btn" aria-label="Volver">‹</button>
        <h1 class="page-title" id="match-page-title" style="font-size:1.1rem;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Partido</h1>
      </div>
    </section>

    <section class="section">
      <div id="match-card-container"></div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="tabs match-detail-tabs" id="match-detail-tabs">
        <button class="tab-btn active" id="match-tab-ranking" type="button" data-i18n="tab.matchPredictions">Predicciones</button>
        <button class="tab-btn" id="match-tab-stats" type="button" data-i18n="tab.matchStats">Estadísticas</button>
      </div>

      <div id="match-section-ranking">
        <p id="match-ranking-notice" class="section-notice hidden" data-i18n="match.predsHidden"></p>
        <div id="match-podium" class="podium"></div>
        <div id="match-ranking-list" class="ranking-list"></div>
      </div>

      <div id="match-section-stats" class="hidden">
        <div id="match-stats-body" class="match-stats"></div>
      </div>
    </section>
  </main>

  <div id="user-preds-overlay" class="user-preds-overlay hidden" aria-hidden="true"></div>
  <div id="user-preds-drawer" class="user-preds-drawer hidden" role="dialog" aria-modal="true">
    <div class="user-preds-drawer__handle"></div>
    <div class="user-preds-drawer__head">
      <div>
        <span id="user-preds-name" class="user-preds-drawer__title">Usuario</span>
        <span id="user-preds-meta" class="user-preds-drawer__meta"></span>
      </div>
      <button id="user-preds-close" class="icon-btn" type="button" aria-label="Cerrar">×</button>
    </div>
    <div id="user-preds-list" class="user-preds-list"></div>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/world-cup-2026.js"></script>
  <script src="../js/groups.js"></script>
  <script src="../js/predictions.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
