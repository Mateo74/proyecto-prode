name: Deploy frontend (Vercel)

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "js/**"
      - "css/**"
      - "pages/**"
      - "assets/**"
      - "manifest.json"
      - "service-worker.js"
      - "vercel.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only run one deploy at a time; cancel a queued one if a newer push arrives.
concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "22"
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      JWT_SECRET: test-secret
      FOOTBAL_DATA_TOKEN: test-football-token
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: prode-backend/package-lock.json

      - name: Install backend dependencies
        working-directory: prode-backend
        run: npm ci

      - name: Run backend tests
        working-directory: prode-backend
        run: npm test

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run frontend tests
        run: npm run test:frontend

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
